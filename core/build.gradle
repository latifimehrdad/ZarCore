plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id("dagger.hilt.android.plugin")
    id 'com.google.devtools.ksp'
}

android {
    compileSdk 34
    namespace 'com.zar.core'
    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 58
        versionName "0.5.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    api 'androidx.core:core-ktx:1.13.1'
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'com.google.android.material:material:1.12.0'
    api 'androidx.constraintlayout:constraintlayout:2.1.4'

    api 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    api "androidx.fragment:fragment-ktx:1.8.4"
    api 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"


    //retrofit
    api 'com.squareup.retrofit2:retrofit:2.9.0'
    api 'com.squareup.retrofit2:converter-gson:2.9.0'
    api 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2'


    //Hilt
    implementation 'com.google.dagger:hilt-android:2.50'
    ksp 'com.google.dagger:hilt-android-compiler:2.50'


    //navigation component
    api("androidx.navigation:navigation-fragment-ktx:2.8.3")
    api("androidx.navigation:navigation-ui-ktx:2.8.3")

    //shimmer loading
    api 'com.facebook.shimmer:shimmer:0.5.0'

    api 'com.elvishew:xlog:1.10.1'

    api 'com.intuit.sdp:sdp-android:1.0.6'

    api 'com.github.cachapa:ExpandableLayout:2.9.2'

    api 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    api "androidx.biometric:biometric-ktx:1.2.0-alpha05"
}